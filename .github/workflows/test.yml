name: test
on: [push, pull_request]
jobs:
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python skills/plan-for-executor/scripts/lint_plan.py examples/2026-10-22-add-due-dates.md
      - name: guard hook command (python3, falling back to python)
        shell: bash
        run: |
          D=skills/plan-for-executor
          ok='{"tool_name":"Bash","tool_input":{"command":"git log --oneline -5"}}'
          bad='{"tool_name":"Bash","tool_input":{"command":"echo x >> plan.md"}}'
          # the exact command from SKILL.md, with CLAUDE_SKILL_DIR pointing here
          cmd=$(sed -n 's/^ *command: //p' $D/SKILL.md | sed "s/^'//; s/'$//")
          run() { CLAUDE_SKILL_DIR=$D bash -c "${cmd//\$\{CLAUDE_SKILL_DIR\}/\$CLAUDE_SKILL_DIR}"; }
          echo "$ok" | run
          if echo "$bad" | run; then echo "guard did not block"; exit 1; fi

schema_version: "1.0"
name: next-adjusts-phase
description: Next mode moves a 2-phase plan to phase 2 and updates its anchors to the rename the executor reported in phase 1.
tags: [next]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Use the plan-for-executor skill in next mode on ./todo-next/plans/2026-10-22-priority.md. Do not ask me anything.
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Glob, Grep, Write, Edit, Bash]
runs: 2
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    min: 1
    arm: with-only
  - type: tool_used
    name: code-not-edited
    tool: Edit
    input_match: 'file_path\W+[^"]*(todo/cli\.py|tests/[^"]*)"'
    min: 0
    max: 0
  - type: tool_used
    name: plan-updated
    tool: Edit
    input_match: "2026-10-22-priority\\.md"
    min: 1
    arm: with-only
  - type: llm
    name: phase-2-adjusted
    criteria: |
      The answer hands out the phase 2 prompt in a fenced block whose step anchors on `def show_tasks(` (the name the
      executor reported in phase 1) instead of `def cmd_list(`; mentioning the old name to explain the rename is fine.
      It says the plan moved to phase 2/2 with a new base commit, and it does not rewrite or redo phase 1.

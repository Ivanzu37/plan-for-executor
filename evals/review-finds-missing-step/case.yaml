schema_version: "1.0"
name: review-finds-missing-step
description: Review mode catches that the executor did step 1 of 2 although its report claims both, without touching code, and writes a fix prompt.
tags: [review]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Use the plan-for-executor skill in review mode on ./todo-review/plans/2026-10-22-verbose.md: Sonnet says it finished. Do not ask me anything.
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Glob, Grep, Write, Edit, Bash]
runs: 2
graders:
  - type: tool_used
    name: no-shell-writes
    tool: Bash
    input_match: 'command\W+[^"]*(>>|\btee\b|sed -i)'
    min: 0
    max: 0
  - type: tool_used
    name: skill-fired
    tool: Skill
    min: 1
    arm: with-only
  - type: tool_used
    name: code-not-edited
    tool: Edit
    input_match: 'file_path\W+[^"]*(todo/cli\.py|tests/[^"]*)"'
    min: 0
    max: 0
  - type: tool_used
    name: code-not-written
    tool: Write
    input_match: 'file_path\W+[^"]*(todo/cli\.py|tests/[^"]*)"'
    min: 0
    max: 0
  - type: tool_used
    name: review-written-to-plan
    tool: Edit
    input_match: "2026-10-22-verbose\\.md"
    min: 1
    arm: with-only
  - type: llm
    name: finds-missing-step
    criteria: |
      The answer says step 1 (the --verbose flag) is done but step 2 (printing "N tasks" in cmd_list) is missing,
      so the executor's report is wrong; the verdict is not "accepted"; and it gives a fix prompt in a fenced block
      for the missing cmd_list work (adding a test for it is fine, since the plan lists tests/test_cli.py), with
      absolute paths and a STOP AND REPORT IF block, and without redoing step 1.

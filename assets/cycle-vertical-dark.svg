<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 534" width="360" height="534" role="img" aria-labelledby="t d">
<title id="t">The plan-for-executor cycle</title>
<desc id="d">Plan with a strong model, execute with a cheaper model in a fresh session, review the diff against the plan, then go to the next phase; if the review finds something missing, a fix prompt goes back to the executor.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9198A1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
<rect x="24" y="36" width="250" height="84" rx="14" fill="#E0805C"/>
<text x="42" y="72" font-size="20" font-weight="600" fill="#0D1117">Plan</text>
<text x="42" y="98" font-size="15" fill="#0D1117">strong model · read-only</text>
<text x="24" y="26" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#9198A1">/plan-for-executor</text>
<rect x="25" y="165" width="248" height="82" rx="13" fill="#151B23" stroke="#656C76" stroke-width="2"/>
<text x="42" y="200" font-size="20" font-weight="600" fill="#E6EDF3">Execute</text>
<text x="42" y="226" font-size="15" fill="#9198A1">cheaper model · fresh session</text>
<text x="24" y="154" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#9198A1">run_plan.py</text>
<rect x="24" y="292" width="250" height="84" rx="14" fill="#E0805C"/>
<text x="42" y="328" font-size="20" font-weight="600" fill="#0D1117">Review</text>
<text x="42" y="354" font-size="15" fill="#0D1117">strong model · diff vs. plan</text>
<text x="24" y="282" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#9198A1">review</text>
<rect x="25" y="421" width="248" height="82" rx="13" fill="#151B23" stroke="#656C76" stroke-width="2"/>
<text x="42" y="456" font-size="20" font-weight="600" fill="#E6EDF3">Next phase</text>
<text x="42" y="482" font-size="15" fill="#9198A1">back to Execute, or done</text>
<text x="24" y="410" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#9198A1">next</text>
<path d="M149.0 124 L149.0 142" stroke="#9198A1" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M149.0 252 L149.0 270" stroke="#9198A1" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M149.0 380 L149.0 398" stroke="#9198A1" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M280 334.0 C318.0 334.0, 318.0 206.0, 286 206.0" stroke="#E0805C" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#a)"/>
<text x="320.0" y="275.0" font-size="14" fill="#E6EDF3">fix</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-labelledby="t d">
<title id="t">The plan-for-executor cycle</title>
<desc id="d">Plan with a strong model, execute with a cheaper model in a fresh session, review the diff against the plan, then go to the next phase; if the review finds something missing, a fix prompt goes back to the executor.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9198A1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
<rect x="20.0" y="70" width="168" height="92" rx="14" fill="#E0805C"/>
<text x="40.0" y="108" font-size="20" font-weight="600" fill="#0D1117">Plan</text>
<text x="40.0" y="132" font-size="14" fill="#0D1117">strong model</text>
<text x="40.0" y="150" font-size="14" fill="#0D1117">reads, never edits</text>
<text x="20.0" y="52" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#9198A1">/plan-for-executor</text>
<rect x="245.0" y="71" width="166" height="90" rx="13" fill="#151B23" stroke="#656C76" stroke-width="2"/>
<text x="264.0" y="108" font-size="20" font-weight="600" fill="#E6EDF3">Execute</text>
<text x="264.0" y="132" font-size="14" fill="#9198A1">cheaper model</text>
<text x="264.0" y="150" font-size="14" fill="#9198A1">fresh session</text>
<text x="244.0" y="52" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#9198A1">run_plan.py</text>
<rect x="468.0" y="70" width="168" height="92" rx="14" fill="#E0805C"/>
<text x="488.0" y="108" font-size="20" font-weight="600" fill="#0D1117">Review</text>
<text x="488.0" y="132" font-size="14" fill="#0D1117">strong model</text>
<text x="488.0" y="150" font-size="14" fill="#0D1117">diff vs. plan</text>
<text x="468.0" y="52" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#9198A1">review</text>
<rect x="693.0" y="71" width="166" height="90" rx="13" fill="#151B23" stroke="#656C76" stroke-width="2"/>
<text x="712.0" y="108" font-size="20" font-weight="600" fill="#E6EDF3">Next phase</text>
<text x="712.0" y="132" font-size="14" fill="#9198A1">back to Execute</text>
<text x="712.0" y="150" font-size="14" fill="#9198A1">or done</text>
<text x="692.0" y="52" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#9198A1">next</text>
<path d="M194.0 116.0 L236.0 116.0" stroke="#9198A1" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M418.0 116.0 L460.0 116.0" stroke="#9198A1" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M642.0 116.0 L684.0 116.0" stroke="#9198A1" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M552.0 168 C552.0 224, 328.0 224, 328.0 172" stroke="#E0805C" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#a)"/>
<text x="440.0" y="234" text-anchor="middle" font-size="14" fill="#E6EDF3">✗ something missing → fix prompt</text>
</g></svg>